name: PING CI

# Every base, including stacked development PRs and future branches. No duplicate push run.
on: pull_request

permissions:
  contents: read

concurrency:
  group: ping-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  java:
    name: Java 21 / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: JDK 21 and dependency cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          verify-signature: true
          overwrite-settings: false
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties
      - name: Verify once with isolated test profiles
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress -Dspring.profiles.default=test clean verify > "$RUNNER_TEMP/ping-maven.log" 2>&1
          result=$?
          set -e
          python3 tools/ci/java_report.py "$RUNNER_TEMP/ping-maven.log" target/surefire-reports
          exit "$result"

  windows:
    name: Tools / Windows
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Python 3.12 (standard library only)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: JDK 21 for launcher and local HTTPS checks
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          verify-signature: true
          overwrite-settings: false
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: .\tools\windows\Test-Scripts.ps1
      - name: Parse with PowerShell 7
        shell: pwsh
        run: .\tools\windows\Test-Scripts.ps1
      - name: Python unit tests once
        shell: pwsh
        run: python -m unittest discover -s tools/windows/tests -p "test_*.py" -v
      - name: Native doubles with Windows PowerShell 5.1
        shell: powershell
        run: .\tools\windows\tests\Test-Native.ps1
      - name: Native doubles with PowerShell 7
        shell: pwsh
        run: .\tools\windows\tests\Test-Native.ps1
