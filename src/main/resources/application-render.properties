# Perfil de la demostración pública en Render Free (se activa con SPRING_PROFILES_ACTIVE=mysql,render).
# Render termina TLS en su proxy y reenvía HTTP al puerto PORT (SERVER_PORT lo fija el entrypoint).
server.address=0.0.0.0
# Tomcat RemoteIpValve: solo confía X-Forwarded-* de proxies en redes privadas (por defecto 10/8, 172.16/12, 192.168/16...).
# Así isSecure(), redirecciones HTTPS, HSTS y los límites por IP del cliente funcionan detrás del proxy de Render.
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=true
# 512 MB y 0,1 CPU: pocos hilos y pocas conexiones (Aiven Free admite 76 en total).
server.tomcat.threads.max=24
server.tomcat.threads.min-spare=2
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
# Aiven puede apagar o reiniciar la base: fallar rápido al validar la conexión y reintentar en la siguiente petición.
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.initialization-fail-timeout=60000
# Sin trazas internas en respuestas públicas (valores por defecto explícitos).
server.error.include-stacktrace=never
server.error.include-message=never
