spring.application.name=PING
spring.profiles.default=mysql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Las sesiones demo usan cookies; no exponer sus IDs en enlaces.
server.servlet.session.tracking-modes=cookie

# Escucha local por defecto; cuentas y permisos también se aplican al habilitar acceso LAN.
server.address=127.0.0.1

# Compress public asset types, never HTML/JSON containing session-bound secrets.
server.compression.enabled=true
server.compression.min-response-size=2KB
server.compression.mime-types=text/css,text/javascript,application/javascript,image/svg+xml,font/ttf

# Explicit address reachable by participants. Empty disables share links/QR, not codes.
ping.public-base-url=${PING_PUBLIC_BASE_URL:}

# Codec accepts8MiB; allow a bounded multipart envelope so ordinary oversize errors are recoverable.
spring.servlet.multipart.max-file-size=9MB
spring.servlet.multipart.max-request-size=10MB
# Keep the error page deliverable for bounded oversized uploads instead of resetting the connection.
server.tomcat.max-swallow-size=12MB

# DEC-049 accounts: external configuration only. Enable SMTP by supplying spring.mail.host.
ping.mail.from=${PING_MAIL_FROM:}
ping.oauth.enabled=${PING_OAUTH_ENABLED:false}
ping.demo.enabled=${PING_DEMO_ENABLED:false}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
