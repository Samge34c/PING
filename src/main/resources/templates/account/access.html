<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Tu cuenta PING')}"></head><body class="participant-entry-page"><header th:replace="~{entry/interests :: topbar}"></header><main id="main-content" class="container pe-page account-page"><a class="pi-back" th:href="@{/organizer}">← Organización</a><h1>Permisos por evento</h1><p class="text-secondary">La persona debe tener una cuenta verificada. El permiso vale solo para el evento elegido.</p><p th:if="${accessSaved}" class="ping-notice" role="status" th:text="${accessSaved}"></p><p th:if="${accessError}" class="ping-notice" role="alert" th:text="${accessError}"></p><form method="post" th:action="@{/organizer/access}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><label class="form-label" for="email">Correo de una cuenta existente</label><input class="form-control" id="email" name="email" type="email" required th:value="${accessEmail}"><label class="form-label mt-3" for="eventId">Evento autorizado</label><select class="form-select" name="eventId" id="eventId"><option th:each="e:${events}" th:value="${e.id}" th:text="${e.name}" th:selected="${selectedEvent != null and selectedEvent == e.id}"></option></select><fieldset class="mt-3"><legend class="form-label">Qué puede hacer</legend><label class="d-flex gap-2 py-2"><input type="radio" name="role" value="ORGANIZER" checked><span><strong>Organización</strong><br><small>Prepara el evento, gestiona sus participantes, revisa tareas y entrega canjes.</small></span></label><label class="d-flex gap-2 py-2"><input type="radio" name="role" value="STAFF"><span><strong>Personal</strong><br><small>Solo revisa tareas y entrega canjes. No prepara el evento ni retira participantes.</small></span></label><p class="ping-help">Si la cuenta ya tenía permiso en este evento, se cambia al elegido.</p></fieldset><div class="action-row mt-4"><button class="btn btn-primary" name="grant" value="true">Asignar permiso</button><button class="btn btn-outline-secondary" name="grant" value="false">Revocar permiso</button></div></form></main><footer th:replace="~{fragments/layout :: footer}"></footer><script th:src="@{/js/account.js}" defer></script></body></html>
