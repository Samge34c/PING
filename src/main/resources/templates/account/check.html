<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Tu cuenta PING')}"></head><body class="participant-entry-page"><header th:replace="~{entry/interests :: topbar}"></header><!-- DEC-061: tras crear la cuenta, un solo paso visible; el enlace inicia sesión donde se abre. -->
<main id="main-content" class="container pe-page account-page fe-account"><a class="pi-back" th:href="@{/register}">← Cambiar correo</a><div th:replace="~{account/context :: entry}"></div><h1>Revisa tu correo</h1>
<p class="fe-sub">Te enviamos un enlace a <strong class="fe-mail" th:text="${registration.email}"></strong>. Ábrelo en este teléfono para activar tu cuenta y continuar.</p>
<p th:if="${param.resent != null}" class="ping-notice" role="status">Te enviamos otro enlace. Usa el más reciente.</p><p class="ping-notice" role="alert" tabindex="-1" data-error-summary th:if="${formError}" th:text="${formError}"></p>
<form method="post" th:action="@{/register/resend}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button class="btn btn-outline-secondary w-100 fe-secondary">Reenviar enlace</button></form>
<p class="pe-help mt-3">¿Lo abriste en otro dispositivo o ya tenías cuenta? <a th:href="@{/login}">Entra con este correo</a></p></main><footer th:replace="~{fragments/layout :: footer}"></footer><script th:src="@{/js/account.js}" defer></script></body></html>
