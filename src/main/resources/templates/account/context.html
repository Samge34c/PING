<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="entry" th:if="${entryEventName != null}" class="account-context" aria-label="Evento que elegiste"><span>Tu entrada a</span><strong th:text="${entryEventName}"></strong><p>Después de entrar, elige tu alias y tus gustos en este evento.</p></section>
<!-- Proveedores configurados (solo pares id/secreto completos). Botón de Google según sus pautas de marca: G a color sin modificar, tema claro/oscuro. -->
<div th:fragment="providers" th:if="${providers != null and !#lists.isEmpty(providers)}" class="social-access">
<a th:each="p:${providers}" th:class="${p=='google'} ? 'gsi-btn' : 'btn btn-outline-secondary w-100 my-2'" th:href="@{/oauth2/authorization/{p}(p=${p})}" data-oauth-start><th:block th:if="${p=='google'}"><svg th:replace="~{account/context :: gLogo}"></svg></th:block><span th:text="${p=='google'?'Continuar con Google':'Continuar con Facebook'}"></span></a>
<p class="pe-help social-note">¿Primera vez? Creamos tu cuenta PING; tu alias y tu avatar los eliges tú después.</p>
<p class="social-or" th:if="${mailAvailable == null or mailAvailable}"><span>o con tu correo</span></p>
</div>
<svg th:fragment="gLogo" class="gsi-logo" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
<button th:fragment="linkButton(p)" th:class="${p=='google'} ? 'gsi-btn my-2' : 'btn btn-outline-secondary my-2'"><th:block th:if="${p=='google'}"><svg th:replace="~{account/context :: gLogo}"></svg></th:block><span th:text="${'Vincular '+(p=='google'?'Google':'Facebook')}"></span></button>
</body></html>
