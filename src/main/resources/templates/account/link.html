<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Tu cuenta PING')}"></head><body class="participant-entry-page"><header th:replace="~{entry/interests :: topbar}"></header><!-- DEC-061: correo de Google ya registrado en PING; comprobar propiedad y seguir sin pasar por Mi cuenta. -->
<main id="main-content" class="container pe-page account-page fe-account"><a class="pi-back" th:href="@{/login}">← Usar otra cuenta</a><div th:replace="~{account/context :: entry}"></div><h1 th:text="${ownerConfirmed} ? |Vincula ${linkProvider}| : 'Confirma que es tu cuenta'"></h1>
<p class="fe-sub" th:if="${!ownerConfirmed}">Ya tienes una cuenta PING con <strong class="fe-mail" th:text="${pendingLink.email}"></strong>. Escribe su contraseña para continuar con <th:block th:text="${linkProvider}"></th:block>.</p>
<p class="fe-sub" th:if="${ownerConfirmed}">Ya entraste en tu cuenta. Vincula <th:block th:text="${linkProvider}"></th:block> para usarlo la próxima vez; tus eventos, puntos y avatar no cambian.</p>
<p class="ping-notice" role="alert" tabindex="-1" data-error-summary th:if="${formError}" th:text="${formError}"></p>
<form method="post" th:action="@{/login/link}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><th:block th:if="${!ownerConfirmed}"><input type="email" name="username" class="visually-hidden" th:value="${pendingLink.email}" autocomplete="username" readonly tabindex="-1" aria-hidden="true"><label for="password" class="form-label">Contraseña de PING</label><div class="password-field"><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required><button class="btn btn-outline-secondary" type="button" data-show-password="password" aria-pressed="false">Mostrar</button></div></th:block>
<button class="btn btn-primary pe-primary mt-4" name="action" value="link"><th:block th:text="|Vincular ${linkProvider} y continuar|"></th:block> <svg th:replace="~{fragments/layout :: icon('arrow')}"></svg></button><button class="btn btn-outline-secondary w-100 mt-2 fe-secondary" name="action" value="skip" th:text="${ownerConfirmed} ? 'Continuar sin vincular' : 'Entrar sin vincular'"></button></form>
<a th:if="${!ownerConfirmed}" class="pi-back" th:href="@{/account/recover}">¿No recuerdas la contraseña? Recupérala</a></main><footer th:replace="~{fragments/layout :: footer}"></footer><script th:src="@{/js/account.js}" defer></script></body></html>
