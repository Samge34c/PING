<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Tu cuenta PING')}"></head><body class="participant-entry-page"><header th:replace="~{entry/interests :: topbar}"></header><main id="main-content" class="container pe-page account-page"><a class="pi-back" th:href="@{/account}">← Mi cuenta</a><p class="eyebrow">ORGANIZACIÓN</p><h1>Tus eventos.</h1><a class="btn btn-outline-primary my-3" th:href="@{/organizer/redemptions}">Validar y entregar un canje</a><a th:if="${general}" class="btn btn-primary my-3" th:href="@{/events/new}">Crear evento</a><a th:if="${general}" class="btn btn-outline-primary my-3" th:href="@{/organizer/access}">Administrar permisos</a><ul class="editor-rows"><li th:each="e:${events}"><div><strong th:text="${e.name}"></strong><p th:text="${e.status.label}"></p><div class="organizer-event-actions"><a th:href="@{/events/{id}(id=${e.id})} + '#entry-share-title'">Código y QR</a><a th:href="@{/events/{id}/encounters(id=${e.id})}">Editar configuración</a><a th:href="@{/events/{id}/rewards(id=${e.id})}">Recompensas</a><a th:href="@{/events/{id}/floorplan(id=${e.id})}">Plano</a></div></div><a th:href="@{/events/{id}(id=${e.id})}">Detalle del evento</a></li></ul><p th:if="${#lists.isEmpty(events)}">Todavía no tienes eventos asignados. El acceso de organización no concede permisos por sí solo.</p><a th:if="${general}" class="btn btn-outline-primary my-3" th:href="@{/interests/taxonomy}">Jerarquía de gustos</a></main><footer th:replace="~{fragments/layout :: footer}"></footer><script th:src="@{/js/account.js}" defer></script></body></html>
