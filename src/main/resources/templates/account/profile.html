<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Tu cuenta PING')}"></head><body class="participant-entry-page"><header th:replace="~{entry/interests :: topbar}"></header><main id="main-content" class="container pe-page account-page"><a class="pi-back" th:href="@{/me}">← Mi Ping</a><h1>Mi cuenta</h1><p th:text="${account.email}"></p><h2 class="h4">Tus eventos</h2><form th:each="p:${participations}" method="post" th:action="@{/account/participations/{e}(e=${p.eventId})}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button class="btn btn-outline-primary my-2 w-100" th:text="${p.eventName+' · '+p.alias}"></button></form><a class="pi-back" th:href="@{/join/event}">Entrar a otro evento</a><h2 class="h4 mt-4" th:if="${!#lists.isEmpty(providers)}">Vincular proveedor</h2><form th:each="p:${providers}" method="post" th:action="@{/account/link/{p}(p=${p})}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button class="btn btn-outline-secondary my-2" th:text="${'Vincular '+(p=='google'?'Google':'Facebook')}"></button></form><form class="mt-4" method="post" th:action="@{/logout}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button class="btn btn-outline-secondary">Cerrar sesión</button></form></main><footer th:replace="~{fragments/layout :: footer}"></footer><script th:src="@{/js/account.js}" defer></script></body></html>
