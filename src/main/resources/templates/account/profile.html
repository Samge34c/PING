<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Tu cuenta PING')}"></head><body class="participant-entry-page"><header th:replace="~{entry/interests :: topbar}"></header><main id="main-content" class="container pe-page account-page"><a class="pi-back" th:href="@{/me}">← Mi Ping</a><h1>Mi cuenta</h1><p th:text="${account.email}"></p>
<th:block th:with="who=${param.provider != null and param.provider[0] == 'facebook' ? 'Facebook' : 'Google'}"><p th:if="${param.linked != null}" class="ping-notice" role="status" th:text="|${param.linked[0] == 'facebook' ? 'Facebook' : 'Google'} quedó vinculado. La próxima vez puedes entrar con «Continuar con ${param.linked[0] == 'facebook' ? 'Facebook' : 'Google'}».|"></p><p th:if="${param.linkError != null}" class="ping-notice" role="alert" th:switch="${param.linkError[0]}"><span th:case="'cancelled'" th:text="|Cancelaste la vinculación con ${who}. Tu cuenta sigue igual.|"></span><span th:case="'expired'" th:text="|La vinculación caducó. Vuelve a pulsar «Vincular ${who}».|"></span><span th:case="'taken'" th:text="|Esa cuenta de ${who} ya pertenece a otra cuenta PING. No se cambió nada.|"></span><span th:case="*" th:text="|${who} no completó la vinculación. Inténtalo de nuevo en un momento.|"></span></p></th:block>
<a th:if="${pendingEventName != null}" class="btn btn-primary pe-primary my-2" th:href="@{/join}" th:text="|Continuar a ${pendingEventName}|"></a>
<h2 class="h4">Tus eventos</h2><form th:each="p:${participations}" method="post" th:action="@{/account/participations/{e}(e=${p.eventId})}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button class="btn btn-outline-primary my-2 w-100" th:text="${p.eventName+' · '+p.alias}"></button></form><a class="pi-back" th:href="@{/join/event}">Entrar a otro evento</a>
<h2 class="h4 mt-4" th:if="${!#lists.isEmpty(providers)}">Acceso con otras cuentas</h2><th:block th:each="p:${providers}"><p th:if="${#lists.contains(linkedProviders, p)}" class="account-linked" th:text="${(p=='google'?'Google':'Facebook')+' · vinculado'}"></p><form th:unless="${#lists.contains(linkedProviders, p)}" method="post" th:action="@{/account/link/{p}(p=${p})}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button th:replace="~{account/context :: linkButton(${p})}"></button></form></th:block>
<form class="mt-4" method="post" th:action="@{/logout}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button class="btn btn-outline-secondary">Cerrar sesión</button></form></main><footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/account.js}" defer></script></body></html>
