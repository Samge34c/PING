<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Tu cuenta PING')}"></head><body class="participant-entry-page"><header th:replace="~{entry/interests :: topbar}"></header><main id="main-content" class="container pe-page account-page"><h1 th:text="${reset?'Nueva contraseña':'Verifica tu correo'}"></h1><p class="ping-notice" role="alert" tabindex="-1" data-error-summary th:if="${formError}" th:text="${formError}"></p><form method="post" th:action="${reset}?@{/account/reset}:@{/account/verify}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><input type="hidden" name="token" th:value="${token}"><th:block th:if="${reset}"><label class="form-label mt-3" for="password">Contraseña</label><div class="password-field"><input class="form-control" id="password" name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password"><button type="button" class="btn btn-outline-secondary" data-show-password="password" aria-pressed="false">Mostrar</button></div><label class="form-label mt-3" for="repeat">Repite la contraseña</label><input class="form-control" id="repeat" name="repeat" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></th:block><p th:unless="${reset}">Confirma que solicitaste crear esta cuenta en PING.</p><button class="btn btn-primary pe-primary mt-4" th:text="${reset?'Guardar contraseña':'Verificar mi correo'}"></button></form><a class="pi-back" th:href="@{/account/recover}">Solicitar otro enlace</a></main><footer th:replace="~{fragments/layout :: footer}"></footer><script th:src="@{/js/account.js}" defer></script></body></html>
