<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Encuentro del evento')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="container ping-form-layout"><a th:href="@{/events/{id}/encounters(id=${event.id})}">← Encuentro del evento</a><h1 th:text="${event.name}"></h1><h2>Punto público</h2><form class="form-sheet p-3" method="post" th:object="${pointForm}" th:action="${itemId == null} ? @{/events/{e}/encounters/points(e=${event.id})} : @{/events/{e}/encounters/points/{id}/edit(e=${event.id},id=${itemId})}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><input type="hidden" th:field="*{version}"><div class="text-danger" th:if="${#fields.hasAnyErrors()}" role="alert"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div><label class="form-label" for="name">Nombre</label><input class="form-control mb-3" th:field="*{name}" maxlength="160" required><label class="form-label" for="directions">Cómo llegar / indicaciones</label><textarea class="form-control mb-3" th:field="*{directions}" rows="3" maxlength="500" required></textarea><label class="d-flex gap-2 my-3"><input type="checkbox" th:field="*{active}">Activo para próximos encuentros</label><p>Editar o desactivar no cambia misiones ya activadas.</p><button class="btn btn-primary">Guardar punto</button></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
