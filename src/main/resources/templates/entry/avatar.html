<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body><fieldset th:fragment="picker" data-avatar-picker><legend class="h4">Tu avatar</legend><div class="preset-avatar" th:classappend="${'avatar-bg-'+avatar.background}" data-avatar-preview role="img" aria-label="Vista previa de tu avatar"><img th:src="@{/img/avatars/animales/{id}.svg(id=${avatar.animal})}" alt="" data-layer="animal"><img th:if="${avatar.accessory!='none'}" th:src="@{/img/avatars/accesorios/{id}.svg(id=${avatar.accessory})}" alt="" data-layer="accessory"><img th:if="${avatar.hat!='none'}" th:src="@{/img/avatars/sombreros/{id}.svg(id=${avatar.hat})}" alt="" data-layer="hat"></div>
<details open><summary>Animal</summary><div class="avatar-options"><label th:each="a:${avatarAnimals}"><input type="radio" name="animal" th:value="${a.key}" th:checked="${a.key==avatar.animal}"><img th:src="@{/img/avatars/animales/{id}.svg(id=${a.key})}" alt=""><span th:text="${a.value}"></span></label></div></details>
<details><summary>Sombrero</summary><div class="avatar-options"><label th:each="a:${avatarHats}"><input type="radio" name="hat" th:value="${a.key}" th:checked="${a.key==avatar.hat}"><span th:text="${a.value}"></span></label></div></details>
<details><summary>Accesorio</summary><div class="avatar-options"><label th:each="a:${avatarAccessories}"><input type="radio" name="accessory" th:value="${a.key}" th:checked="${a.key==avatar.accessory}"><span th:text="${a.value}"></span></label></div></details>
<details><summary>Color</summary><div class="avatar-options"><label th:each="a:${avatarColors}" th:classappend="${'avatar-swatch-'+a.key}"><input type="radio" name="background" th:value="${a.key}" th:checked="${a.key==avatar.background}"><span th:text="${a.value}"></span></label></div></details><script th:src="@{/js/avatar.js}" defer></script></fieldset></body></html>
