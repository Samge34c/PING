<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- DEC-058 · Avatares V3. Retrato compartido: alta, edición, Mi Ping, conexión e historial usan este fragmento.
     Un avatar V3 se compone por capas sobre el mismo lienzo 256×256 (encuadre al 84 %, D05). Los avatares del catálogo
     anterior (estilo preset) se siguen mostrando con sus recursos hasta que la persona guarda uno V3. -->
<span th:fragment="portrait(value)" th:remove="tag"><span th:if="${value.v3 != null}" class="preset-avatar avatar-public avatar-v3" th:style="'--avatar-disc:' + ${value.v3.disc()}" role="img" th:attr="aria-label=${'Avatar: '+value.label()}"><img th:each="src : ${value.v3.layers()}" th:src="@{${src}}" alt="" width="256" height="256" decoding="async"></span><span th:if="${value.v3 == null}" class="preset-avatar avatar-public" th:classappend="${'avatar-bg-'+value.background}" role="img" th:attr="aria-label=${'Avatar: '+value.label()}"><img th:src="@{/img/avatars/animales/{id}.svg(id=${value.animal})}" alt=""><img th:if="${value.accessory!='none'}" th:src="@{/img/avatars/accesorios/{id}.svg(id=${value.accessory})}" alt=""><img th:if="${value.hat!='none'}" th:src="@{/img/avatars/sombreros/{id}.svg(id=${value.hat})}" alt=""></span></span>

<!-- Vista previa pequeña del borrador (alta): la actualiza avatar.js dentro del mismo formulario. -->
<span th:fragment="preview" class="preset-avatar avatar-v3 av3-preview" data-avatar-preview th:style="'--avatar-disc:' + ${avatarDraft.disc()}" role="img" th:attr="aria-label=${'Vista previa de tu avatar: '+avatarDraft.label()}"><img th:each="src : ${avatarDraft.layers()}" th:src="@{${src}}" alt="" width="256" height="256" decoding="async"></span>

<!-- Escenario del personalizador (/me/avatar): estado del borrador, Deshacer y vista grande. -->
<div th:fragment="stage" class="av3-stage">
<div class="av3-status"><span class="av3-chip" data-av3-chip>Tu avatar guardado</span><button type="button" class="av3-undo" data-av3-undo hidden disabled>Deshacer</button></div>
<span class="av3-ring" data-av3-ring><span class="preset-avatar avatar-v3 av3-preview av3-preview-lg" data-avatar-preview th:style="'--avatar-disc:' + ${avatarDraft.disc()}" role="img" th:attr="aria-label=${'Vista previa de tu avatar: '+avatarDraft.label()}"><img th:each="src : ${avatarDraft.layers()}" th:src="@{${src}}" alt="" width="256" height="256" decoding="async"></span></span>
<p class="av3-summary" data-av3-summary th:text="${avatarDraft.label()}"></p>
</div>

<!-- Un grupo de opciones del editor. kind: animal|palette|head|audio|face|neck. -->
<section th:fragment="group(kind,name,label,options,selected)" class="av3-panel" th:attr="data-av-panel=${kind},data-label=${label}">
<h3 class="av3-title" th:text="${label}"></h3>
<div class="av3-grid" th:classappend="${kind=='palette'} ? 'av3-grid-3' : ''">
<label class="av3-opt" th:each="e : ${options}" th:classappend="${e.key=='none'} ? 'is-none' : ''">
<input type="radio" th:name="${name}" th:value="${e.key}" th:checked="${e.key==selected}" th:attr="data-label=${e.value}">
<span class="av3-thumb" data-av3-tile th:attr="data-kind=${kind},data-id=${e.key}" th:style="'--avatar-disc:' + ${kind=='palette' ? avatarV3Discs.get(e.key) : avatarDraft.disc()}"><img th:each="src : ${avatarDraft.tile(kind,e.key)}" th:src="@{${src}}" alt="" width="256" height="256" loading="lazy" decoding="async"></span>
<span class="av3-name" th:text="${e.value}"></span>
</label>
</div>
</section>

<!-- Colores de la pieza de un slot; solo se aplican cuando hay pieza. -->
<div th:fragment="colors(slot,name,selected)" class="av3-colors" th:attr="data-av3-colors=${slot}">
<span class="av3-colors-label">Color de la pieza</span>
<div class="av3-color-row"><label class="av3-color" th:each="c : ${avatarV3Colors}"><input type="radio" th:name="${name}" th:value="${c.key}" th:checked="${c.key==selected}" th:attr="data-label=${c.value}"><i th:class="${'av3-swatch av3-swatch-'+c.key}"></i><span th:text="${c.value}"></span></label></div>
</div>

<!-- Editor V3 compartido por /join y /me/avatar. Radios nativos con las listas del servidor; sin JavaScript se ven todos los grupos.
     avatar.js los convierte en pestañas, compone la vista previa, retira la pieza incompatible avisando antes de guardar
     y repinta las miniaturas cuando cambian el animal o el pelaje. El servidor vuelve a validar al guardar. -->
<!-- data-saved (solo /me/avatar): selección persistida; «none» = aún no hay avatar V3 guardado, el borrador es una propuesta. -->
<fieldset th:fragment="editor" class="av3-editor" data-avatar-v3 th:attr="data-bulky=${avatarV3Bulky},data-saved=${legacyPreset == null ? null : (avatarSaved == null ? 'none' : avatarSaved.formFields())}">
<legend class="visually-hidden">Personaliza tu avatar</legend>
<p class="av3-conflict" data-av3-conflict role="status" th:attr="hidden=${avatarError == null ? 'hidden' : null}" th:text="${avatarError}"></p>
<section th:replace="~{entry/avatar :: group('animal','animal','Animal',${avatarV3Animals},${avatarDraft.animal})}"></section>
<section th:replace="~{entry/avatar :: group('palette','palette','Pelaje',${avatarV3Palettes},${avatarDraft.palette})}"></section>
<div class="av3-slot" data-av3-slot="head"><section th:replace="~{entry/avatar :: group('head','head','Cabeza',${avatarV3Heads},${avatarDraft.head})}"></section><div th:replace="~{entry/avatar :: colors('head','headColor',${avatarDraft.headColor})}"></div></div>
<div class="av3-slot" data-av3-slot="audio"><section th:replace="~{entry/avatar :: group('audio','audio','Audio',${avatarV3Audios},${avatarDraft.audio})}"></section><div th:replace="~{entry/avatar :: colors('audio','audioColor',${avatarDraft.audioColor})}"></div></div>
<div class="av3-slot" data-av3-slot="face"><section th:replace="~{entry/avatar :: group('face','face','Cara',${avatarV3Faces},${avatarDraft.face})}"></section><div th:replace="~{entry/avatar :: colors('face','faceColor',${avatarDraft.faceColor})}"></div></div>
<div class="av3-slot" data-av3-slot="neck"><section th:replace="~{entry/avatar :: group('neck','neck','Cuello',${avatarV3Necks},${avatarDraft.neck})}"></section><div th:replace="~{entry/avatar :: colors('neck','neckColor',${avatarDraft.neckColor})}"></div></div>
<script th:src="@{/js/avatar.js}" defer></script>
</fieldset>
</body>
</html>
