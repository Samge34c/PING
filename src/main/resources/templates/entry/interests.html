<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Elige tus intereses')}"></head><body class="participant-entry-page participant-interests-page"><header th:fragment="topbar" class="entry-topbar"><a class="ping-skip" href="#main-content">Saltar al contenido</a><a th:replace="~{fragments/layout :: brand}"></a><div th:replace="~{fragments/layout :: theme}"></div></header>
<!-- DEC-058 · D08-1: intereses V2 sobre el selector compartido de DEC-045/056 (mismo estado, búsqueda y bandeja). -->
<main id="main-content" class="container pi-page pe-page ic-page"><div class="ic-top"><span class="ic-me"><strong th:text="${alias}"></strong> <span>· <span th:text="${eventName}"></span></span></span><p class="pe-step">Paso 3 de 3 · Tus gustos</p></div>
<ol class="id-progress" aria-label="Progreso de la entrada"><li data-state="done"><span class="visually-hidden">Evento, completado</span></li><li data-state="done"><span class="visually-hidden">Identidad, completado</span></li><li aria-current="step"><span class="visually-hidden">Gustos, paso actual</span></li></ol>
<h1>¿Qué te gusta?</h1><p class="ic-lede">Con tus gustos te proponemos personas afines. Elige los que quieras; puedes cambiarlos después.</p>
<p th:if="${entryError}" class="ping-notice" role="alert" tabindex="-1" data-error-summary th:text="${entryError}"></p>
<form class="ic-editor" data-interest-editor method="post" th:action="@{/join/interests}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><input type="hidden" name="draftKey" th:value="${draftKey}"><input type="hidden" name="revision" th:value="${revision}">
<div th:replace="~{interests/selector :: choices}"></div>
<div class="ic-actions"><div class="ic-actions-line"><p data-selected-count role="status" aria-live="polite" th:text="${#lists.size(selectedNames) + ' intereses seleccionados'}"></p><button type="button" class="ic-review" data-review aria-controls="ic-tray" aria-expanded="false" hidden>Revisar</button></div><button class="btn btn-primary" name="action" value="complete"><span th:text="${'Entrar a ' + eventName}">Entrar al evento</span> <svg th:replace="~{fragments/layout :: icon('arrow')}"></svg></button></div><button class="btn btn-link pe-return" name="action" value="back">← Tu identidad o evento</button></form><p class="pe-academic">Simulación académica. Sin vínculo oficial con SOFA.</p></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
