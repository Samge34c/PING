<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Elige tus intereses')}"></head><body class="participant-entry-page participant-interests-page"><header th:fragment="topbar" class="entry-topbar"><a class="ping-skip" href="#main-content">Saltar al contenido</a><a th:replace="~{fragments/layout :: brand}"></a><div th:replace="~{fragments/layout :: theme}"></div></header>
<main id="main-content" class="container pi-page pe-page"><p class="pe-step">3 de 3 · Afinidad</p><header class="pi-heading"><h1>¿Qué te gusta?</h1><p><strong th:text="${alias}"></strong> · <span th:text="${eventName}"></span></p><p>Elige lo que te apetece compartir. Puedes cambiarlo después.</p></header>
<p th:if="${entryError}" class="ping-notice" role="alert" th:text="${entryError}"></p>
<form data-interest-editor method="post" th:action="@{/join/interests}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><input type="hidden" name="draftKey" th:value="${draftKey}"><input type="hidden" name="revision" th:value="${revision}">
<fieldset><legend class="visually-hidden">Tus intereses</legend><div class="interest-list"><div class="interest-row" th:each="interest : ${interests}" th:attr="data-interest-name=${interest.name}"><input type="checkbox" name="interestIds" th:id="${'entry-interest-' + interest.id}" th:value="${interest.id}" th:checked="${selectedIds.contains(interest.id)}"><label class="interest-row-content" th:for="${'entry-interest-' + interest.id}"><span class="interest-icon"><svg th:replace="~{fragments/layout :: icon('heart')}"></svg></span><span class="interest-check"><svg th:replace="~{fragments/layout :: icon('check')}"></svg></span><strong th:text="${interest.name}"></strong></label></div></div></fieldset>
<div class="interest-selection-footer"><p data-selected-count>Elige tus intereses.</p><button class="btn btn-primary" name="action" value="complete">Ir a Mi Ping <svg th:replace="~{fragments/layout :: icon('arrow')}"></svg></button><button class="btn btn-link" name="action" value="back">Corregir alias o evento</button></div></form><p class="pe-academic">Simulación académica. Sin vínculo oficial con SOFA.</p></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
