<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Elige tus intereses')}"></head><body class="participant-entry-page participant-interests-page"><header th:fragment="topbar" class="entry-topbar"><a class="ping-skip" href="#main-content">Saltar al contenido</a><a th:replace="~{fragments/layout :: brand}"></a><div th:replace="~{fragments/layout :: theme}"></div></header>
<main id="main-content" class="container pi-page pe-page"><p class="pe-step">3 de 3 · Afinidad</p><header class="pi-heading"><h1>¿Qué te gusta?</h1><p><strong th:text="${alias}"></strong> · <span th:text="${eventName}"></span></p><p>Elige lo que te apetece compartir. Puedes cambiarlo después.</p></header>
<p th:if="${entryError}" class="ping-notice" role="alert" tabindex="-1" data-error-summary th:text="${entryError}"></p>
<form class="ic-editor" data-interest-editor method="post" th:action="@{/join/interests}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><input type="hidden" name="draftKey" th:value="${draftKey}"><input type="hidden" name="revision" th:value="${revision}">
<div th:replace="~{interests/selector :: choices}"></div>
<div class="ic-actions"><p data-selected-count role="status" aria-live="polite" th:text="${#lists.size(selectedNames) + ' intereses seleccionados'}"></p><button class="btn btn-primary" name="action" value="complete">Ir a Mi Ping <svg th:replace="~{fragments/layout :: icon('arrow')}"></svg></button></div><button class="btn btn-link pe-return" name="action" value="back">Corregir alias o evento</button></form><p class="pe-academic">Simulación académica. Sin vínculo oficial con SOFA.</p></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
