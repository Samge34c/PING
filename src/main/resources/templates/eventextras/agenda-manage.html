<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Mi evento')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="event-extras"><div th:replace="~{fragments/layout :: message}"></div><a class="link-44" th:href="@{/events/{id}/preparation(id=${event.id})}">← Preparación del evento</a><p class="eyebrow" th:text="${event.name}"></p><h1>Agenda general</h1><p>Separa el programa del evento de la actividad asignada a cada encuentro. Consultar o asistir no da puntos.</p><a class="btn btn-primary" th:href="@{/events/{id}/agenda/new(id=${event.id})}">Añadir actividad</a><p th:if="${#lists.isEmpty(agenda)}">Todavía no hay agenda. El evento puede seguir funcionando.</p><article class="extra-row" th:each="item:${agenda}"><h2 th:text="${item.title}"></h2><p th:text="${item.schedule()}"></p><p th:text="${item.active ? 'Publicada' : 'Oculta'}"></p><a class="link-44" th:href="@{/events/{id}/agenda/{item}/edit(id=${event.id},item=${item.id})}">Editar actividad</a></article></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
