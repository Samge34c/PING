<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Mi evento')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="event-extras"><div th:replace="~{fragments/layout :: message}"></div><a class="link-44" th:href="@{/organizer(event=${event.id})}">← Organización</a><p class="eyebrow" th:text="${event.name}"></p><h1>Actividades abiertas</h1><p>Lo que publiques aquí lo ve cualquier participante del evento, aunque no tenga match. No da puntos ni cuenta como conexión completada.</p><a class="btn btn-primary" th:href="@{/events/{id}/agenda/new(id=${event.id})}">Publicar actividad abierta</a><p th:if="${#lists.isEmpty(agenda)}">Todavía no hay actividades abiertas. El evento puede seguir funcionando.</p><article class="extra-row" th:each="item:${agenda}"><h2 th:text="${item.title}"></h2><p th:text="${item.schedule()}"></p><p th:if="${!#strings.isEmpty(item.place)}" th:text="${item.place}"></p><p th:text="${item.active ? 'Publicada para participantes' : 'Oculta'}"></p><a class="link-44" th:href="@{/events/{id}/agenda/{item}/edit(id=${event.id},item=${item.id})}">Editar</a></article></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
