<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Mi evento')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="event-extras"><div th:replace="~{fragments/layout :: message}"></div><a class="link-44" th:href="@{/me}">← Mi Ping</a><p class="eyebrow" th:text="${event.name}"></p><h1>Agenda del evento</h1><p>Programa general · distinto de tu actividad del encuentro. No da puntos ni requiere inscripción.</p><p class="extra-empty" th:if="${#lists.isEmpty(agenda)}">Este evento aún no tiene actividades de agenda publicadas. Puedes seguir usando PING.</p><a class="btn btn-outline-primary" th:if="${#lists.isEmpty(agenda)}" href="/connect">Ir a Conectar</a><article class="extra-row agenda-activity" th:each="item:${agenda}" th:attr="data-agenda-state=${item.state(agendaNow)}"><time class="agenda-hour" th:text="${item.hour()}"></time><div class="agenda-detail"><span class="agenda-state" th:text="${item.state(agendaNow)}"></span><h2 th:text="${item.title}"></h2><p class="extra-status" th:text="${item.schedule()}"></p><p th:text="${item.description}"></p><p th:if="${!#strings.isEmpty(item.place)}" th:text="${item.place}"></p><a class="link-44" th:if="${item.pointId != null}" th:href="@{/events/{id}/plan(id=${event.id},pointId=${item.pointId})}">Ver punto en el plano / indicaciones</a><p th:if="${item.pointId != null}" th:text="${pointNames.get(item.pointId)}"></p></div></article><nav class="extra-links"><a th:href="@{/me/help}">Ayuda del evento</a><a th:href="@{/me/challenges}">Reto voluntario</a></nav></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
