<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Mi evento')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="event-extras"><div th:replace="~{fragments/layout :: message}"></div><a class="link-44" th:href="@{/organizer}">← Mis eventos</a><p class="eyebrow">ORGANIZACIÓN</p><h1>Prepara tu evento</h1><h2 th:text="${event.name}"></h2><p>Estado real y accesos directos. Lo opcional no bloquea los eventos existentes.</p><section class="extra-row preparation-step" th:each="row:${preparation}"><svg th:replace="~{fragments/layout :: icon('grid')}"></svg><div class="preparation-copy"><span class="extra-status" th:text="${row.kind}"></span><h2 th:text="${row.title}"></h2><p th:text="${row.state}"></p><a class="link-44" th:href="${row.edit}">Revisar y editar</a></div></section><nav class="extra-links"><a th:href="@{/events/{id}/experience-settings(id=${event.id})}">Ayuda y opciones</a><a th:href="@{/events/{id}/agenda(id=${event.id})}">Administrar agenda</a></nav></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
