<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Detalle del evento')}"></head><body>
<nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="container"><a th:href="@{/events}">← Volver a eventos</a><div class="card p-4 mt-3"><div th:replace="~{fragments/layout :: message}"></div>
<div class="d-flex flex-wrap justify-content-between gap-2"><h1 th:text="${event.name}"></h1><span class="badge bg-primary align-self-start" th:text="${event.status.label}"></span></div>
<p class="description" th:text="${#strings.isEmpty(event.description)} ? 'Sin descripción.' : ${event.description}"></p>
<p class="text-secondary small">Creado: <time th:text="${event.createdAt}"></time></p><a class="align-self-start mb-3" th:href="@{/events/{id}/edit(id=${event.id})}">Editar datos</a>
<div class="d-flex flex-wrap gap-2">
<form th:if="${event.status.name() == 'DRAFT'}" method="post" th:action="@{/events/{id}/open(id=${event.id})}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button class="btn btn-success">Abrir evento</button></form>
<form th:if="${event.status.name() == 'OPEN'}" method="post" th:action="@{/events/{id}/pause(id=${event.id})}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button class="btn btn-warning">Pausar</button></form>
<form th:if="${event.status.name() == 'PAUSED'}" method="post" th:action="@{/events/{id}/resume(id=${event.id})}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button class="btn btn-success">Reanudar</button></form>
<form th:if="${event.status.name() == 'OPEN' or event.status.name() == 'PAUSED'}" method="post" th:action="@{/events/{id}/close(id=${event.id})}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button class="btn btn-outline-danger">Cerrar evento</button></form>
</div><p th:if="${event.status.name() == 'CLOSED'}" class="mt-3 text-secondary">Este evento está cerrado y permanece en el historial.</p>
</div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
