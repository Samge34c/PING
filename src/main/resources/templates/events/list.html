<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Eventos')}"></head><body>
<nav th:replace="~{fragments/layout :: nav}"></nav><main class="container"><div class="d-flex flex-wrap justify-content-between gap-3 mb-3"><div><h1>Eventos</h1><p class="text-secondary">Crea y gestiona los encuentros de Ping.</p></div><a class="btn btn-primary align-self-start" th:href="@{/events/new}">Crear evento</a></div>
<div th:replace="~{fragments/layout :: message}"></div>
<div th:if="${#lists.isEmpty(events)}" class="card p-4"><h2 class="h5">Todavía no hay eventos</h2><p>Crea el primero para comenzar.</p></div>
<div th:unless="${#lists.isEmpty(events)}" class="card p-3 table-responsive"><table class="table align-middle"><caption>Eventos registrados</caption><thead><tr><th scope="col">Nombre</th><th scope="col">Estado</th><th scope="col">Acciones</th></tr></thead><tbody><tr th:each="event : ${events}"><td th:text="${event.name}"></td><td><span class="badge bg-primary" th:text="${event.status.label}"></span></td><td><a th:href="@{/events/{id}(id=${event.id})}">Ver detalle</a><span class="mx-2">·</span><a th:href="@{/events/{id}/edit(id=${event.id})}">Editar</a></td></tr></tbody></table></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
