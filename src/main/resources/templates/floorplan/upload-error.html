<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Revisar imagen')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="container ping-form-layout"><h1>Elige una imagen más ligera</h1><th:block th:with="reward=${backUrl != null and #strings.contains(backUrl,'/rewards/')}"><p role="alert" th:text="${reward ? 'La imagen de la recompensa admite hasta 8 MiB. No se guardaron cambios: la recompensa y su imagen anterior se conservan.' : 'El plano admite hasta 8 MiB. No se guardaron cambios. Exporta una imagen más ligera y vuelve a intentarlo; el plano anterior y sus marcadores se conservan.'}"></p><a class="btn btn-primary" th:href="${backUrl}" th:text="${reward ? 'Volver a la recompensa' : 'Volver al plano'}"></a></th:block></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
