<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · Ping'">Ping</title>
  <script th:src="@{/js/theme-init.js}"></script>
  <script th:src="@{/js/theme-toggle.js}" defer></script>
  <link th:href="@{/vendor/bootstrap/bootstrap.min.css}" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link th:href="@{/css/brand.css}" rel="stylesheet">
</head>
<body>
<nav th:fragment="nav" class="navbar mb-4" aria-label="Navegación principal"><a class="ping-skip" href="#main-content">Saltar al contenido</a><div class="container d-flex flex-wrap gap-3">
  <a class="navbar-brand fw-bold" th:href="@{/}" aria-label="Ping, inicio"><img th:if="${brandLogoAvailable}" class="ping-navbar-logo" th:src="@{/img/ping-logo.jpg}" alt="Ping — logo oficial"><span th:unless="${brandLogoAvailable}">PING</span></a><div class="ping-nav-links"><a class="text-white" th:href="@{/events}">Eventos</a><a class="text-white" th:href="@{/participants}">Participantes</a><a class="text-white" th:href="@{/interests}">Intereses</a><a class="text-white" th:href="@{/me}">Mi Ping</a><a class="text-white" th:href="@{/admin}">Panel demo</a><a class="text-white" th:href="@{/demo}">Demo</a><a class="text-white" th:if="${session.pingDemoParticipantId != null}" th:href="@{/me/benefits}">Beneficios</a></div>
  <div class="ping-theme-switch" role="group" aria-label="Tema de Ping"><button type="button" class="btn btn-outline-primary" data-theme-option="dark" aria-pressed="true">🌙 Oscuro</button><button type="button" class="btn btn-outline-primary" data-theme-option="light" aria-pressed="false">☀️ Claro</button></div>
  <span class="text-white-50 small">Demo académica</span>
</div></nav>
<div th:fragment="message" th:if="${message}" class="alert" th:classappend="${messageTone == 'notice'} ? 'ping-notice' : 'alert-success'" role="status" th:text="${message}"></div>
<footer th:fragment="footer" class="container py-4 text-secondary small">Ping · Samuel Riveros y Julián Caicedo · Proyecto académico</footer>
</body></html>
