<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Intereses')}"></head><body class="participant-interests-page"><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="container pi-page"><header class="pi-heading"><h1>¿Qué te gusta?</h1><p>Explora temas para compartir, agrupados por categoría.</p></header>
<p th:unless="${session.pingEntryMode == 'participant'}"><a th:href="@{/interests/categories}">Administrar categorías</a></p>
<div th:if="${session.pingDemoParticipantId != null}" th:attr="data-interest-selection-url=@{/participants/{id}/interests(id=${session.pingDemoParticipantId})}"><a class="btn btn-primary" th:href="@{/participants/{id}/interests(id=${session.pingDemoParticipantId})}">Elegir mis intereses</a></div>
<div th:if="${session.pingDemoParticipantId == null}"><section class="ic-group" th:each="group : ${interestGroups}"><h2 class="h5" th:text="${group.name}"></h2><ul class="d-flex flex-wrap gap-3"><li th:each="i : ${group.choices}" th:text="${i.name}"></li></ul></section><p>Datos de demostración: se conservan los intereses del catálogo existente.</p><a class="btn btn-primary" th:href="@{/join}">Elegir mis intereses</a></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
