<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Categorías de intereses')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="container ping-form-layout"><a th:href="@{/interests}">← Catálogo de intereses</a><h1>Categorías</h1><p>Organizan la selección. Compartir una categoría no cuenta como compartir un interés.</p><p class="small text-secondary">Administración académica existente, sin autenticación nueva.</p><a class="btn btn-primary" th:href="@{/interests/categories/new}">Añadir categoría</a><ol class="ic-admin-list"><li th:each="c : ${categories}"><h2 class="h5" th:text="${c.name}"></h2><p><span th:text="${c.active ? 'Activa' : 'Inactiva'}"></span> · Orden <span th:text="${c.presentationOrder}"></span></p><p th:text="${#lists.isEmpty(c.members) ? 'Sin intereses asociados' : #strings.listJoin(c.members,' · ')}"></p><a th:href="@{/interests/categories/{id}/edit(id=${c.id})}">Editar categoría y asociación</a></li></ol></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
