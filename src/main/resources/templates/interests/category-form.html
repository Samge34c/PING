<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Editar categoría')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="container ping-form-layout"><a th:href="@{/interests/categories}">← Categorías</a><h1 th:text="${itemId == null ? 'Crear categoría' : 'Editar categoría'}"></h1><form class="form-sheet p-3" method="post" th:object="${categoryForm}" th:action="${itemId == null} ? @{/interests/categories} : @{/interests/categories/{id}/edit(id=${itemId})}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><input type="hidden" th:field="*{version}"><div th:if="${#fields.hasAnyErrors()}" role="alert" class="ping-notice"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div><label for="name" class="form-label">Nombre</label><input class="form-control mb-3" th:field="*{name}" required maxlength="80"><label for="presentationOrder" class="form-label">Orden de presentación (0–9999)</label><input class="form-control mb-3" type="number" th:field="*{presentationOrder}" min="0" max="9999" required><label class="d-flex gap-2 py-3"><input type="checkbox" th:field="*{active}">Activa para nuevas selecciones</label><p>Desactivar conserva los intereses ya elegidos y los encuentros.</p><fieldset class="mb-3"><legend class="h5">Intereses de esta categoría</legend><p>Marcar uno de otra categoría lo mueve aquí. Quitar uno lo deja en Otros intereses; no cambia las selecciones de participantes.</p><label class="d-flex gap-2 py-2" th:each="i : ${interests}"><input type="checkbox" th:field="*{interestIds}" th:value="${i.id}"><span th:text="${i.name + ' · ' + (i.category == null ? 'Otros intereses' : i.category.name)}"></span></label></fieldset><button class="btn btn-primary">Guardar categoría</button></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
