<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Elegir intereses')}"></head><body class="participant-interests-page"><nav th:replace="~{fragments/layout :: nav}"></nav>
<main id="main-content" class="container pi-page">
<a class="pi-back" th:href="${session.pingEntryMode == 'participant' and participant.id == session.pingDemoParticipantId} ? @{/me} : @{/participants/{id}(id=${participant.id})}">← Volver</a>
<header class="pi-heading"><h1>Tus intereses</h1><p><strong th:text="${participant.alias}"></strong> · <span th:text="${participant.eventName}"></span></p><p>Elige temas que te apetece compartir. Puedes cambiarlos después.</p></header>
<form class="ic-editor" data-interest-editor method="post" th:action="@{/participants/{id}/interests(id=${participant.id})}" th:object="${interestSelectionForm}">
<input type="hidden" name="_csrf" th:value="${csrfToken}"><input type="hidden" th:field="*{version}">
<div th:if="${#fields.hasAnyErrors()}" class="ping-notice" role="alert"><p>Revisa la selección y vuelve a guardar.</p><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p><a th:href="@{/participants/{id}/interests(id=${participant.id})}">Recargar selección guardada</a></div>
<div th:replace="~{interests/selector :: choices}"></div>
<div class="ic-actions"><p data-selected-count role="status" aria-live="polite" th:text="${#lists.size(selectedNames) + ' intereses seleccionados'}"></p><button class="btn btn-primary">Guardar intereses <svg th:replace="~{fragments/layout :: icon('check')}"></svg></button></div>
</form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
