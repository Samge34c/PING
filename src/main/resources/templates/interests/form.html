<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Elegir intereses')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="container"><header class="page-heading"><div><span class="eyebrow">AFINIDAD / TU SELECCIÓN</span><h1>Intereses de <span th:text="${participant.alias}"></span></h1><p>Evento: <span th:text="${participant.eventName}"></span> · Puedes seleccionar varios temas.</p></div></header><form data-interest-editor method="post" th:action="@{/participants/{id}/interests(id=${participant.id})}" th:object="${interestSelectionForm}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><input type="hidden" th:field="*{version}"><div th:if="${#fields.hasAnyErrors()}" class="ping-notice mb-4" role="alert">Revisa la selección y vuelve a guardar.</div><fieldset><legend class="visually-hidden">Selecciona tus intereses</legend><div class="interest-list"><div class="interest-row" th:each="interest : ${interests}" th:attr="data-interest-name=${interest.name}"><input type="checkbox" th:field="*{interestIds}" th:value="${interest.id}"><label class="interest-row-content" th:for="${#ids.prev('interestIds')}"><span class="interest-check"><svg th:replace="~{fragments/layout :: icon('check')}"></svg></span><span class="interest-icon"><svg th:replace="~{fragments/layout :: icon('heart')}"></svg></span><strong th:text="${interest.name}"></strong><small data-interest-description>Un tema para conectar.</small></label></div></div></fieldset><div class="interest-selection-footer"><p data-selected-count>Selecciona lo que te gusta. La afinidad empieza aquí.</p><div class="action-row"><a class="btn btn-outline-secondary" th:href="@{/participants/{id}(id=${participant.id})}">Cancelar</a><button class="btn btn-primary">Guardar intereses <svg th:replace="~{fragments/layout :: icon('check')}"></svg></button></div></div></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
