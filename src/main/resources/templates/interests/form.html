<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Elegir intereses')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="container"><h1>Intereses de <span th:text="${participant.alias}"></span></h1><p>Evento: <span th:text="${participant.eventName}"></span></p><p class="text-secondary">Catálogo de demostración. Puedes seleccionar varios temas.</p><form class="card p-4" method="post" th:action="@{/participants/{id}/interests(id=${participant.id})}" th:object="${interestSelectionForm}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><input type="hidden" th:field="*{version}"><div th:if="${#fields.hasAnyErrors()}" class="text-danger mb-3" role="alert">Revisa la selección y vuelve a guardar.</div><fieldset><legend class="h5">Selecciona tus intereses</legend><div class="row g-3 mt-1"><div class="col-12 col-sm-6" th:each="interest : ${interests}"><div class="form-check"><input class="form-check-input" type="checkbox" th:field="*{interestIds}" th:value="${interest.id}"><label class="form-check-label" th:for="${#ids.prev('interestIds')}" th:text="${interest.name}"></label></div></div></div></fieldset><div class="d-flex gap-2 mt-4"><button class="btn btn-primary">Guardar intereses</button><a class="btn btn-outline-secondary" th:href="@{/participants/{id}(id=${participant.id})}">Cancelar</a></div></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
