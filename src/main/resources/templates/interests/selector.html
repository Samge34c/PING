<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="choices" class="interest-category-selector" data-interest-selector>
  <div class="ic-summary"><strong>Elegidos</strong><p data-selection-summary th:text="${#lists.isEmpty(selectedNames) ? 'Aún ninguno. Puedes continuar sin elegir.' : #strings.listJoin(selectedNames, ' · ')}"></p></div>
  <div class="ic-controls" data-filter-controls hidden>
    <div><label for="interest-category-filter" class="form-label">Mostrar</label><select class="form-select" id="interest-category-filter" data-interest-filter><option value="all">Todos los intereses</option><option th:each="group : ${interestGroups}" th:value="${group.id}" th:text="${group.name}"></option></select></div>
    <div th:if="${interestOptionCount > 12}"><label for="interest-search" class="form-label">Buscar un interés</label><input class="form-control" type="search" id="interest-search" data-interest-search autocomplete="off" placeholder="Escribe un nombre"></div>
    <p class="ic-filter-status" data-filter-status role="status" aria-live="polite"></p>
  </div>
  <div class="ic-groups">
    <fieldset th:each="group : ${interestGroups}" class="ic-group" th:attr="data-interest-group=${group.id}"><legend th:text="${group.name}"></legend>
      <p class="ic-retained-help" th:if="${group.id == 'retained'}" th:text="${selectionContext == 'entry' ? 'Estas opciones dejaron de estar disponibles. Quítalas para terminar tu entrada; el resto del borrador se conserva.' : 'Tu selección anterior se conserva. Puedes mantener estos intereses o quitarlos; una vez guardada la retirada, no podrás añadirlos mientras la categoría esté inactiva.'}"></p>
      <div class="interest-list"><div class="interest-row" th:each="interest : ${group.choices}" th:attr="data-interest-name=${interest.name}">
        <input type="checkbox" name="interestIds" th:id="${'interestIds' + interest.id}" th:value="${interest.id}" th:checked="${selectedIds.contains(interest.id)}">
        <label class="interest-row-content" th:for="${'interestIds' + interest.id}"><span class="interest-icon"><svg th:replace="~{fragments/layout :: icon('heart')}"></svg></span><span class="interest-check"><svg th:replace="~{fragments/layout :: icon('check')}"></svg></span><strong th:text="${interest.name}"></strong><small th:unless="${interest.available}">No disponible para añadir</small></label>
      </div></div>
    </fieldset>
  </div>
  <div data-interest-empty th:hidden="${!#lists.isEmpty(interestGroups)}" class="ping-notice ic-empty"><p>No hay intereses que coincidan con este filtro. Prueba otro nombre o muestra todas las categorías. Si el catálogo está vacío, puedes continuar sin elegir.</p><button type="button" class="btn btn-outline-primary" data-clear-filter>Mostrar todos</button></div>
</div>
</body></html>
