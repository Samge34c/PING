<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Selector compartido: alta (/join/interests), edición (/participants/{id}/interests) y editor en línea del catálogo.
     Los checkboxes name=interestIds con el ID real son el único estado; interest-selector.js solo muestra, filtra y resume.
     Sin JavaScript queda la lista completa por categorías. -->
<div th:fragment="choices" class="interest-category-selector" data-interest-selector>
  <div class="ic-tray" id="ic-tray" data-tray hidden>
    <div class="ic-tray-line">
      <div class="ic-tray-head"><strong>Elegidos</strong><output data-tray-count aria-hidden="true">0</output></div>
      <div class="ic-tray-chips" data-tray-chips></div>
      <button type="button" class="ic-tray-more" data-tray-more aria-expanded="false" aria-controls="ic-tray-all" hidden></button>
    </div>
    <div class="ic-tray-all" id="ic-tray-all" data-tray-all hidden></div>
  </div>
  <div class="ic-summary">
    <strong>Elegidos</strong>
    <p data-selection-summary th:text="${#lists.isEmpty(selectedNames) ? 'Aún ninguno. Puedes continuar sin elegir.' : #strings.listJoin(selectedNames, ' · ')}"></p>
    <details data-selected-details hidden><summary>Ver todos los intereses elegidos</summary><p data-selected-list></p></details>
  </div>
  <div class="ic-controls" data-filter-controls hidden>
    <div>
      <label for="interest-category-filter" class="form-label">Mostrar</label>
      <select class="form-select" id="interest-category-filter" data-interest-filter>
        <option value="all">Todos los intereses</option>
        <option th:each="group : ${interestGroups}" th:value="${group.id}" th:text="${group.name}"></option>
      </select>
    </div>
    <div th:if="${interestOptionCount > 12}">
      <label for="interest-search" class="form-label">Buscar un interés</label>
      <input class="form-control" type="search" id="interest-search" data-interest-search autocomplete="off" th:placeholder="${'Buscar entre ' + interestOptionCount + ' gustos'}">
    </div>
    <p class="ic-filter-status" data-filter-status role="status" aria-live="polite"></p>
  </div>
  <!-- DEC-058 · D08-1 (Figma 133:1703): mundos en una tira de pestañas y, dentro del mundo, grupos por familia con su recuento.
       interest-selector.js coloca las filas reales en cada familia; con búsqueda vuelven a su categoría. -->
  <div th:if="${taxonomyNodes != null}" class="ic-taxonomy" data-taxonomy hidden>
    <div class="ic-nav" data-taxonomy-nav hidden><h2 class="ic-world-title" data-taxonomy-heading tabindex="-1">Resultados</h2></div>
    <div class="ic-worlds" role="group" aria-label="Mundos de gustos">
      <button th:each="node : ${taxonomyNodes}" th:if="${node.parent == null}" type="button" class="ic-world" aria-pressed="false" th:attr="data-node-key=${node.key},data-node-parent=${node.parent},data-node-label=${node.label}">
        <svg class="ping-icon ic-world-icon" aria-hidden="true"><use href="" data-world-icon></use></svg>
        <span class="ic-world-name" th:text="${node.label}"></span>
        <b class="ic-world-count" data-node-selected aria-hidden="true"></b>
      </button>
    </div>
    <div class="ic-families" data-families>
      <section th:each="node : ${taxonomyNodes}" th:if="${node.parent != null}" class="ic-fam" hidden th:attr="data-family-key=${node.key},data-family-parent=${node.parent}">
        <div class="ic-fam-head"><h3 th:text="${node.label}"></h3><span data-family-count></span></div>
        <div class="interest-list" data-family-list></div>
      </section>
      <section class="ic-fam" hidden data-family-rest>
        <div class="ic-fam-head"><h3>Más opciones</h3><span data-family-count></span></div>
        <div class="interest-list" data-family-list></div>
      </section>
    </div>
  </div>
  <div class="ic-groups">
    <fieldset th:each="group : ${interestGroups}" class="ic-group" th:attr="data-interest-group=${group.id}">
      <legend th:text="${group.name}"></legend>
      <p class="ic-retained-help" th:if="${group.id == 'retained'}" th:text="${selectionContext == 'entry' ? 'Estas opciones dejaron de estar disponibles. Quítalas para terminar tu entrada; el resto del borrador se conserva.' : 'Tu selección anterior se conserva. Puedes mantener estos intereses o quitarlos; una vez guardada la retirada, no podrás añadirlos mientras la categoría esté inactiva.'}"></p>
      <div class="interest-list">
        <!-- Fila repetida cientos de veces y servida sin compresión: sin espacios entre etiquetas (la fila y su etiqueta son block/grid). -->
        <div class="interest-row" th:each="interest : ${group.choices}" th:attr="data-interest-name=${interest.name},data-interest-nodes=${taxonomyMemberships != null and taxonomyMemberships.containsKey(interest.id) ? #strings.listJoin(taxonomyMemberships.get(interest.id),'|') : ''}"><input type="checkbox" name="interestIds" th:id="${'interestIds' + interest.id}" th:value="${interest.id}" th:checked="${selectedIds.contains(interest.id)}"><label class="interest-row-content" th:for="${'interestIds' + interest.id}"><span class="interest-icon"><svg th:replace="~{fragments/layout :: icon('heart')}"></svg></span><span class="interest-check"><svg th:replace="~{fragments/layout :: icon('check')}"></svg></span><strong th:text="${interest.name}"></strong><small th:unless="${interest.available}">No disponible para añadir</small></label></div>
      </div>
    </fieldset>
  </div>
  <div data-interest-empty th:hidden="${!#lists.isEmpty(interestGroups)}" class="ping-notice ic-empty">
    <p>No hay intereses que coincidan con este filtro. Prueba otro nombre o muestra todas las categorías. Si el catálogo está vacío, puedes continuar sin elegir.</p>
    <button type="button" class="btn btn-outline-primary" data-clear-filter>Mostrar todos</button>
  </div>
</div>
</body>
</html>
