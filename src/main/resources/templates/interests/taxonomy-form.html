<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Editar grupo de gustos')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="container ping-form-layout"><a th:href="@{/interests/taxonomy}">← Jerarquía</a><h1 th:text="${editing?'Editar grupo':'Añadir grupo'}"></h1><form method="post" th:object="${taxonomyForm}" th:action="${editing}?@{/interests/taxonomy/{key}/edit(key=*{nodeKey})}:@{/interests/taxonomy}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><input type="hidden" th:field="*{revision}"><div class="ping-notice" role="alert" data-error-summary th:if="${#fields.hasAnyErrors()}"><p th:each="err:${#fields.allErrors()}" th:text="${err}"></p></div><label for="nodeKey" class="form-label">Clave estable · minúsculas, números, guion y dos puntos</label><input class="form-control mb-3" th:field="*{nodeKey}" maxlength="100" pattern="[a-z0-9][a-z0-9:-]{0,99}" th:readonly="${editing}" required><label for="label" class="form-label">Nombre visible</label><input class="form-control mb-3" th:field="*{label}" maxlength="80" required><label for="parent" class="form-label">Dentro de</label><select class="form-select mb-3" th:field="*{parent}"><option value="">Familia raíz</option><option th:each="n:${nodes}" th:unless="${n.key==taxonomyForm.nodeKey}" th:value="${n.key}" th:text="${n.label}"></option></select><label class="d-flex gap-2 py-3"><input type="checkbox" th:field="*{active}">Visible en la navegación</label><details><summary>Intereses explícitos de este grupo</summary><p>Asociar no mueve el interés de otros grupos ni cambia selecciones o afinidad.</p><label class="d-flex gap-2 py-2" th:each="i:${interests}"><input type="checkbox" th:field="*{interestIds}" th:value="${i.id}"><span th:text="${i.name}"></span></label></details><div class="action-row my-3"><button class="btn btn-primary">Guardar grupo</button><a class="btn btn-outline-primary" th:href="@{/interests/taxonomy}">Cancelar</a></div></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
