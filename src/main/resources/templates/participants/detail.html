<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Participante')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container"><a th:href="@{/participants}">← Volver a participantes</a><section class="card p-4 mt-3"><div th:replace="~{fragments/layout :: message}"></div><p th:if="${formError}" role="alert" class="text-danger" th:text="${formError}"></p><h1 th:text="${participant.alias}"></h1><p>Evento: <a th:href="@{/events/{id}(id=${participant.eventId})}" th:text="${participant.eventName}"></a></p><p><span class="badge bg-primary" th:text="${participant.available} ? 'Disponible' : 'No disponible'"></span></p><form method="post" th:action="@{/participants/{id}/availability(id=${participant.id})}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><input type="hidden" name="version" th:value="${participant.version}"><input type="hidden" name="available" th:value="${!participant.available}"><button class="btn btn-primary" th:text="${participant.available} ? 'Marcar no disponible' : 'Marcar disponible'"></button></form></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
