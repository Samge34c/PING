<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Participante')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="container ping-form-layout"><a th:href="@{/participants}">← Volver a participantes</a><section class="card p-4 mt-3"><div th:replace="~{fragments/layout :: message}"></div><p th:if="${formError}" role="alert" class="text-danger" th:text="${formError}"></p><div class="profile-top"><span class="avatar avatar-large" th:text="${#strings.toUpperCase(#strings.substring(participant.alias,0,1))}"></span><span class="eyebrow">TU ESPACIO / TU AFINIDAD</span></div><h1 th:text="${participant.alias}"></h1><p class="text-secondary">Evento: <a th:href="@{/events/{id}(id=${participant.eventId})}" th:text="${participant.eventName}"></a></p><p><span class="badge bg-primary" th:text="${participant.available} ? 'Disponible' : 'No disponible'"></span></p><form method="post" th:action="@{/participants/{id}/availability(id=${participant.id})}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><input type="hidden" name="version" th:value="${participant.version}"><input type="hidden" name="available" th:value="${!participant.available}"><button class="btn btn-primary" th:text="${participant.available} ? 'Marcar no disponible' : 'Marcar disponible'"></button></form><p class="mt-3">Saldo: <strong th:text="${participant.points}"></strong> puntos</p><a th:href="@{/demo(participantId=${participant.id})}">Entrar con este participante</a><hr><h2 class="h5">Intereses</h2><p th:if="${#lists.isEmpty(participant.interests)}" class="text-secondary">Sin intereses seleccionados.</p><div class="d-flex flex-wrap gap-2 mb-3"><span class="badge bg-primary" th:each="interest : ${participant.interests}" th:text="${interest}"></span></div><a class="btn btn-outline-primary align-self-start" th:href="@{/participants/{id}/interests(id=${participant.id})}">Elegir intereses</a></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
