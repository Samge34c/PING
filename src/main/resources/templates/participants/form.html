<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Registrar participante')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main class="container"><h1>Registrar participante</h1><p class="text-secondary">Usa un alias para participar en tu evento.</p><div th:if="${#lists.isEmpty(events)}" class="card p-4 mb-3"><p>Primero necesitas un evento abierto.</p><a th:href="@{/events}">Ir a Eventos</a></div><form th:unless="${#lists.isEmpty(events)}" class="card p-4" method="post" th:action="@{/participants}" th:object="${participantForm}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><div class="mb-3"><label for="alias" class="form-label">Alias</label><input class="form-control" th:field="*{alias}" required maxlength="80" aria-describedby="alias-error"><div id="alias-error" class="text-danger" th:errors="*{alias}"></div></div><div class="mb-3"><label for="eventId" class="form-label">Evento</label><select class="form-select" th:field="*{eventId}" required aria-describedby="event-error"><option value="">Selecciona un evento abierto</option><option th:each="event : ${events}" th:value="${event.id}" th:text="${event.name}"></option></select><div id="event-error" class="text-danger" th:errors="*{eventId}"></div></div><div class="form-check mb-3"><input class="form-check-input" type="checkbox" th:field="*{available}"><label class="form-check-label" th:for="${#ids.prev('available')}">Estoy disponible para conectar</label></div><div class="d-flex gap-2"><button class="btn btn-primary">Registrar</button><a class="btn btn-outline-secondary" th:href="@{/participants}">Cancelar</a></div></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
