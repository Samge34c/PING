<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Participantes')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="container"><header class="page-heading"><div><span class="eyebrow">PERSONAS, NO PERFILES ETERNOS</span><h1>Tu gente está aquí.</h1><p>Intereses, disponibilidad y energía para una buena conversación.</p></div><a class="btn btn-primary" th:href="@{/participants/new}"><svg th:replace="~{fragments/layout :: icon('plus')}"></svg>Registrar participante</a></header><div th:replace="~{fragments/layout :: message}"></div><th:block th:if="${#lists.isEmpty(participants)}"><div th:replace="~{fragments/layout :: empty('users','Todo empieza con una persona','Abre un evento e invita a los primeros participantes a conectar.',@{/participants/new},'Registrar participante')}"></div></th:block><section class="people-grid"><article class="ping-card ping-profile card-hover" th:each="p : ${participants}"><div class="profile-top"><span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(p.alias,0,1))}"></span><span class="ping-status" th:classappend="${p.available} ? 'available' : ''" th:text="${p.available} ? 'Disponible' : 'No disponible'"></span></div><h2 th:text="${p.alias}"></h2><p class="profile-event" th:text="${p.eventName}"></p><div class="chip-list"><span class="ping-chip" th:each="interest : ${p.interests}" th:text="${interest}"></span><span th:if="${#lists.isEmpty(p.interests)}" class="small text-secondary">Aún por descubrir sus intereses.</span></div><div class="profile-foot"><span class="pts-number"><span th:text="${p.points}"></span> <small>PTS</small></span><a th:href="@{/participants/{id}(id=${p.id})}" class="small">Ver participante <svg th:replace="~{fragments/layout :: icon('arrow')}"></svg></a></div></article></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
