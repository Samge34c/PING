<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Participantes')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="container"><div class="d-flex flex-wrap justify-content-between gap-3"><div><h1>Participantes</h1><p class="text-secondary">Un alias, un evento y ganas de conectar.</p></div><a class="btn btn-primary align-self-start" th:href="@{/participants/new}">Registrar participante</a></div><div th:replace="~{fragments/layout :: message}"></div><div th:if="${#lists.isEmpty(participants)}" class="card p-4">Todavía no hay participantes. Abre un evento y registra el primero.</div><div th:unless="${#lists.isEmpty(participants)}" class="card p-3 table-responsive"><table class="table align-middle"><caption>Participantes registrados</caption><thead><tr><th scope="col">Alias</th><th scope="col">Evento</th><th scope="col">Disponibilidad</th><th scope="col">Acciones</th></tr></thead><tbody><tr th:each="participant : ${participants}"><td th:text="${participant.alias}"></td><td th:text="${participant.eventName}"></td><td><span class="badge bg-primary" th:text="${participant.available} ? 'Disponible' : 'No disponible'"></span></td><td><a th:href="@{/participants/{id}(id=${participant.id})}">Ver participante</a></td></tr></tbody></table></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
