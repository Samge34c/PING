<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="editor" class="hint-editor hint-visible" data-hint-editor th:with="saved=${persistedRecognitionHint != null ? persistedRecognitionHint : ''}" th:attr="data-hint-error=${hintError != null}">
<h2>¿Cómo pueden reconocerte hoy?</h2><p class="small text-secondary">Opcional · Solo tu conexión podrá verla durante un encuentro activo.</p>
<div data-hint-persisted><p class="hint-saved-text" th:if="${!#strings.isEmpty(saved)}" th:text="${saved}"></p><span data-hint-saved-value hidden th:text="${saved}"></span></div>
<details data-hint-edit-panel th:attr="data-hint-empty=${#strings.isEmpty(saved)}" th:open="${#strings.isEmpty(saved) or hintError != null}"><summary th:text="${#strings.isEmpty(saved) ? 'Tu pista de hoy' : 'Editar'}"></summary>
<form method="post" th:action="@{/me/recognition-hint}" th:object="${recognitionHintForm}" data-hint-form>
<input type="hidden" name="_csrf" th:value="${csrfToken}"><input type="hidden" th:field="*{version}">
<label class="form-label" for="recognitionHint">Una prenda o accesorio que lleves hoy</label>
<textarea id="recognitionHint" class="form-control" th:field="*{hint}" placeholder="Por ejemplo: morral morado" maxlength="240" rows="2" aria-describedby="recognition-help recognition-count recognition-errors" th:attr="aria-invalid=${hintError != null}" data-hint-input></textarea>
<p id="recognition-help" class="small text-secondary">No incluyas teléfono, redes, datos sensibles ni ubicación privada. Déjala vacía y guarda para borrarla.</p>
<div class="hint-meta"><span id="recognition-count" data-hint-count th:text="${#lists.size(recognitionHintForm.hintCharacters) + ' / 120 caracteres'}">0 / 120 caracteres</span><span data-hint-draft hidden>Borrador sin guardar</span></div>
<p id="recognition-errors" class="text-danger" th:text="${hintError}"></p>
<div class="hint-suggestions" data-hint-suggestions hidden aria-label="Ideas que puedes personalizar"><button type="button" data-hint-suggestion="Camiseta ">Camiseta</button><button type="button" data-hint-suggestion="Gorra ">Gorra</button><button type="button" data-hint-suggestion="Morral ">Morral</button><button type="button" data-hint-suggestion="Cosplay de ">Cosplay</button></div><div class="action-row"><button class="btn" th:classappend="${currentMatch != null} ? 'btn-outline-primary' : 'btn-primary'" type="submit">Guardar pista</button><a class="btn btn-link" th:href="@{/me}" data-hint-cancel>Cancelar</a></div>
</form></details></section></body></html>
