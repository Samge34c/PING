<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Entregar un beneficio')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="container ping-form-layout"><a th:href="@{/organizer}">← Organización</a><h1>Entregar un beneficio</h1><p>Escanea o introduce el código del recibo. Solo puedes entregar beneficios de eventos autorizados.</p><p class="ping-notice" th:if="${deliveryMessage}" th:text="${deliveryMessage}" role="status"></p><p class="ping-notice" th:if="${deliveryError}" th:text="${deliveryError}" role="alert"></p><form method="post" th:action="@{/organizer/redemptions/lookup}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><label class="form-label" for="delivery-credential">Código del recibo</label><input class="form-control" name="credential" id="delivery-credential" maxlength="96" autocomplete="off" autocapitalize="characters" spellcheck="false" required><div th:replace="~{verification/scanner :: scanner('REDEMPTION','delivery-credential')}"></div><button class="btn btn-primary">Consultar recibo</button></form><section th:if="${delivery}" class="my-4"><h2 class="h4" th:text="${delivery.benefit}"></h2><p>Cantidad: 1 · <span th:text="${delivery.cost}"></span> puntos ya descontados.</p><p th:text="${delivery.location}"></p><p th:text="${delivery.directions}"></p><p th:text="${delivery.status=='REQUESTED'?'Pendiente de entrega':(delivery.status=='DELIVERED'?'Ya entregado':'Incidencia registrada')}"></p><form th:if="${delivery.status=='REQUESTED'}" method="post" th:action="@{/organizer/redemptions/deliver}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><input type="hidden" name="credential" th:value="${credential}"><div class="action-row"><button class="btn btn-primary" name="status" value="DELIVERED">Confirmar entrega</button><button class="btn btn-outline-secondary" name="status" value="INCIDENT">Registrar incidencia</button></div></form></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
