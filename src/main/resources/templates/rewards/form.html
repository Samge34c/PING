<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Recompensas del evento')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="container ping-form-layout"><a th:href="@{/events/{id}(id=${event.id})}">← Detalle del evento</a><h1>Recompensas</h1><p th:text="${event.name}"></p><form class="form-sheet p-3" method="post" th:object="${benefitForm}" th:action="${itemId == null} ? @{/events/{e}/rewards(e=${event.id})} : @{/events/{e}/rewards/{id}/edit(e=${event.id},id=${itemId})}"><input type="hidden" name="_csrf" th:value="${csrfToken}"><input type="hidden" th:field="*{version}"><div class="text-danger" th:if="${#fields.hasAnyErrors()}" role="alert"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div><label class="form-label" for="name">Nombre</label><input class="form-control mb-3" th:field="*{name}" maxlength="120" required><label class="form-label" for="description">Descripción</label><textarea class="form-control mb-3" rows="3" th:field="*{description}" maxlength="2000"></textarea><label class="form-label" for="claimLocation">Lugar de reclamación</label><input class="form-control mb-3" th:field="*{claimLocation}" maxlength="160" required><label class="form-label" for="claimInstructions">Indicaciones de reclamación</label><textarea class="form-control mb-3" rows="3" th:field="*{claimInstructions}" maxlength="500" required></textarea><label for="pointsCost" class="form-label">Coste en puntos (1–10000)</label><input type="number" class="form-control mb-3" th:field="*{pointsCost}" min="1" max="10000" required><label class="d-flex gap-2 my-3"><input type="checkbox" th:field="*{active}">Disponible para nuevos canjes</label><p>Los canjes solicitados conservan su coste, nombre e instrucciones. Desactivar no los cancela.</p><button class="btn btn-primary">Guardar recompensa</button></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
