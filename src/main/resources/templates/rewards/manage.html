<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Recompensas del evento')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="container ping-form-layout"><a th:href="@{/organizer(event=${event.id})}">← Organización</a><h1>Recompensas</h1><p th:text="${event.name}"></p><p>Lo que los participantes pueden canjear con sus puntos en este evento. Añade una imagen para que se reconozca a primera vista.</p><a class="btn btn-primary" th:href="@{/events/{e}/rewards/new(e=${event.id})}">Añadir recompensa</a><p th:if="${#lists.isEmpty(benefits)}" class="rv-empty mt-3">Aún no hay recompensas. Crea la primera para que los puntos tengan un uso.</p><ul class="mt-4 rw-admin-list"><li th:each="b : ${benefits}"><img class="rw-thumb" th:src="${b.hasImage()} ? @{/events/{e}/rewards/{id}/image(e=${event.id},id=${b.id},v=${b.imageRevision})} : @{/img/rewards/predeterminada.svg}" th:attr="data-fallback=@{/img/rewards/predeterminada.svg}" alt="" width="96" height="54" loading="lazy"><div><h2 class="h5" th:text="${b.name}"></h2><p class="small" th:text="${b.hasImage() ? 'Con imagen propia' : 'Sin imagen · se muestra la predeterminada'}"></p><p><span th:text="${b.pointsCost}"></span> puntos · <span th:text="${b.active ? 'Disponible' : 'Inactiva'}"></span></p><p class="description" th:text="${b.claimLocation}"></p><a th:href="@{/events/{e}/rewards/{id}/edit(e=${event.id},id=${b.id})}">Editar recompensa e imagen</a></div></li></ul></main><footer th:replace="~{fragments/layout :: footer}"></footer><script th:src="@{/js/reward-images.js}" defer></script></body></html>
