<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Recompensas del evento')}"></head><body><nav th:replace="~{fragments/layout :: nav}"></nav><main id="main-content" class="container ping-form-layout"><a th:href="@{/events/{id}(id=${event.id})}">← Detalle del evento</a><h1>Recompensas</h1><p th:text="${event.name}"></p><p>Administración académica existente, sin autenticación nueva. El beneficio demo anterior se conserva.</p><a class="btn btn-primary" th:href="@{/events/{e}/rewards/new(e=${event.id})}">Añadir recompensa</a><ul class="mt-4"><li th:each="b : ${benefits}"><h2 class="h5" th:text="${b.name}"></h2><p><span th:text="${b.pointsCost}"></span> puntos · <span th:text="${b.active ? 'Disponible' : 'Inactiva'}"></span></p><p class="description" th:text="${b.claimLocation}"></p><a th:href="@{/events/{e}/rewards/{id}/edit(e=${event.id},id=${b.id})}">Editar recompensa</a></li></ul></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
