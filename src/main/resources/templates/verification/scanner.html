<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="scanner(purpose,target)" class="qr-scanner my-3" data-scanner th:attr="data-purpose=${purpose},data-target=${target},data-join-path=@{/join},data-allowed-origin=${scannerBase}"><div class="action-row"><button type="button" class="btn btn-outline-primary" data-scan-start>Escanear QR</button><button type="button" class="btn btn-outline-secondary" data-scan-stop hidden>Cancelar cámara</button></div><p class="small mt-2" data-scan-status role="status" aria-live="polite">También puedes introducir el código. La cámara se abre solo cuando la solicitas.</p><label data-scan-camera-label hidden class="form-label mt-2">Cámara<select class="form-select" data-scan-camera aria-label="Elegir cámara"></select></label><video hidden data-scan-video playsinline muted aria-label="Vista de cámara para leer un QR"></video><script th:src="@{/js/qr-scanner.js}" defer></script></div></body></html>
